      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        background: #070707;
      }
      #boot.is-away {

        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 50%;
        -webkit-mask-image: radial-gradient(circle closest-side, #000 99.6%, transparent 100%);
        mask-image: radial-gradient(circle closest-side, #000 99.6%, transparent 100%);
      }
      .boot__planet,
      .boot__brand {
        position: absolute;
